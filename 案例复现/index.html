<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>迷你版校园信息中心</title>
  <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/4.6.2/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-spy="scroll" data-target="#mainNav" data-offset="100">
  <nav id="mainNav" class="navbar navbar-expand-md navbar-dark bg-dark sticky-top">
    <a class="navbar-brand" href="#home">校园信息中心</a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navMenu"
            aria-controls="navMenu" aria-expanded="false" aria-label="切换导航">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div id="navMenu" class="collapse navbar-collapse">
      <ul class="navbar-nav ml-auto">
        <li class="nav-item"><a class="nav-link" href="#home">首页</a></li>
        <li class="nav-item"><a class="nav-link" href="#rooms">自习室</a></li>
        <li class="nav-item"><a class="nav-link" href="#stats">统计</a></li>
        <li class="nav-item"><a class="nav-link" href="three-d/scene.html">校园三维</a></li>
      </ul>
    </div>
  </nav>
  <main>
    <header id="home" class="py-5 bg-light">
      <div class="container">
        <h1 class="h3 mb-1">迷你版校园公共信息与数据展示中心</h1>
        <p class="text-muted mb-4">前端技术整合案例复现：页面 · 交互 · 图表 · 三维</p>
        <div class="row">
          <div class="col-12 col-md-4 mb-3">
            <div class="card h-100 shadow-sm">
              <div class="card-body">
                <h5 class="card-title">自习室查询</h5>
                <p class="card-text">按楼层与开放状态筛选自习室列表。</p>
                <a href="#rooms" class="card-link">进入查询</a>
              </div>
            </div>
          </div>
          <div class="col-12 col-md-4 mb-3">
            <div class="card h-100 shadow-sm">
              <div class="card-body">
                <h5 class="card-title">使用统计</h5>
                <p class="card-text">各自习室使用量柱状图，数据来自 data.json。</p>
                <a href="#stats" class="card-link">查看统计</a>
              </div>
            </div>
          </div>
          <div class="col-12 col-md-4 mb-3">
            <div class="card h-100 shadow-sm">
              <div class="card-body">
                <h5 class="card-title">校园三维导览</h5>
                <p class="card-text">A-Frame 地标场景，独立子页面加载。</p>
                <a href="three-d/scene.html" class="card-link">进入导览</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </header>
    <section id="rooms" class="py-5">
      <div class="container">
        <h2>自习室查询</h2>
        <p class="text-muted">占位：第2步在此实现楼层／开放状态筛选列表。</p>
      </div>
    </section>
    <section id="stats" class="py-5 bg-light">
      <div class="container">
        <h2>使用统计</h2>
        <p class="text-muted">占位：第2步在此加载 data.json 渲染使用量柱状图。</p>
      </div>
    </section>
  </main>
  <footer class="py-4 bg-dark text-white-50 text-center">
    <small>迷你版校园信息中心 · 前端技术整合案例复现 · 2026 秋季学期</small>
  </footer>
  <script src="https://cdn.bootcdn.net/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/4.6.2/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.bootcdn.net/ajax/libs/echarts/5.5.1/echarts.min.js"></script>

</html>
