<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的书架 · 个人阅读看板</title>
  <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/4.6.2/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-spy="scroll" data-target="#mainNav" data-offset="100">
  <nav id="mainNav" class="navbar navbar-expand-md navbar-dark bg-secondary sticky-top">
    <a class="navbar-brand" href="#home">我的书架</a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navMenu"
            aria-controls="navMenu" aria-expanded="false" aria-label="切换导航">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div id="navMenu" class="collapse navbar-collapse">
      <ul class="navbar-nav ml-auto">
        <li class="nav-item"><a class="nav-link" href="#home">首页</a></li>
        <li class="nav-item"><a class="nav-link" href="#shelf">书架管理</a></li>
        <li class="nav-item"><a class="nav-link" href="#stats">阅读统计</a></li>
        <li class="nav-item"><a class="nav-link" href="three-d/study.html">三维书房</a></li>
      </ul>
    </div>
  </nav>
  <main>
    <header id="home" class="py-5 bg-light">
      <div class="container">
        <h1 class="h3 mb-1">我的书架 · 个人阅读看板</h1>
        <p class="text-muted mb-4">记录你的每一本书：管理书单、统计阅读、走进三维书房</p>
        <div class="row">
          <div class="col-12 col-md-4 mb-3">
            <div class="card h-100 shadow-sm">
              <div class="card-body">
                <h5 class="card-title">书架管理</h5>
                <p class="card-text">按状态筛选、搜索、添加与删除书目，数据本地保存。</p>
                <a href="#shelf" class="card-link">进入书架</a>
              </div>
            </div>
          </div>
          <div class="col-12 col-md-4 mb-3">
            <div class="card h-100 shadow-sm">
              <div class="card-body">
                <h5 class="card-title">阅读统计</h5>
                <p class="card-text">各月读完数量柱状图与分类占比饼图，与书架数据同源。</p>
                <a href="#stats" class="card-link">查看统计</a>
              </div>
            </div>
          </div>
          <div class="col-12 col-md-4 mb-3">
            <div class="card h-100 shadow-sm">
              <div class="card-body">
                <h5 class="card-title">三维书房</h5>
                <p class="card-text">A-Frame 书架场景，独立子页面加载，可往返。</p>
                <a href="three-d/study.html" class="card-link">进入书房</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </header>
    <section id="shelf" class="py-5">
      <div class="container">
        <h2>书架管理</h2>
        <section id="shelf" class="py-5">
          <div class="container">
            <h2 class="mb-4">书架管理</h2>
            <div id="shelfLoading" class="text-center py-5">
              <div class="spinner-border text-secondary" role="status"></div>
              <p class="mt-2 text-muted">书目加载中…</p>
            </div>
            <div id="shelfError" class="alert alert-danger d-none" role="alert">
              书目加载失败：请确认通过本地服务器访问，且 data/books.json 存在。
              <button id="retryBtn" class="btn btn-sm btn-danger ml-2">重试</button>
            </div>
            <div id="shelfBody" class="d-none">
              <form id="addForm" class="form-row align-items-end mb-3">
                <div class="col-12 col-md-3 mb-2">
                  <label class="sr-only" for="bookTitle">书名</label>
                  <input id="bookTitle" class="form-control" placeholder="书名（必填）" maxlength="50">
                </div>
                <div class="col-6 col-md-2 mb-2">
                  <label class="sr-only" for="bookAuthor">作者</label>
                  <input id="bookAuthor" class="form-control" placeholder="作者" maxlength="30">
                </div>
                <div class="col-6 col-md-2 mb-2">
                  <label class="sr-only" for="bookCategory">分类</label>
                  <select id="bookCategory" class="custom-select">
                    <option>科幻</option><option>文学</option><option>历史</option>
                    <option>编程</option><option>其他</option>
                  </select>
                </div>
                <div class="col-6 col-md-2 mb-2">
                  <label class="sr-only" for="bookStatus">状态</label>
                  <select id="bookStatus" class="custom-select">
                    <option value="wish">想读</option>
                    <option value="reading">在读</option>
                    <option value="done">读完</option>
                  </select>
                </div>
                <div class="col-6 col-md-3 mb-2">
                  <button type="submit" class="btn btn-secondary btn-block">添加到书架</button>
                </div>
                <div class="col-12"><small id="formHint" class="text-danger"></small></div>
              </form>
              <div class="form-row align-items-center mb-3">
                <div class="col-6 col-md-3 mb-2 mb-md-0">
                  <label class="sr-only" for="statusFilter">按状态筛选</label>
                  <select id="statusFilter" class="custom-select">
                    <option value="all">全部状态</option>
                    <option value="wish">想读</option>
                    <option value="reading">在读</option>
                    <option value="done">读完</option>
                  </select>
                </div>
                <div class="col-6 col-md-3">
                  <label class="sr-only" for="searchInput">搜索</label>
                  <input id="searchInput" class="form-control" placeholder="搜索书名或作者">
                </div>
                <div class="col-12 mt-2"><small class="text-muted" id="bookCount"></small></div>
              </div>
              <div id="bookList" class="row"></div>
            </div>
          </div>
        </section>
      </div>
    </section>
    <section id="stats" class="py-5 bg-light">
      <div class="container">
        <h2>阅读统计</h2>
        <section id="stats" class="py-5 bg-light">
          <div class="container">
            <h2 class="mb-4">阅读统计</h2>
            <div class="row">
              <div class="col-12 col-lg-6 mb-3">
                <!-- 图表容器必须定高（防止高度为0图表不显示） -->
                <div id="chartMonth" style="height: 380px;"></div>
              </div>
              <div class="col-12 col-lg-6 mb-3">
                <div id="chartCategory" style="height: 380px;"></div>
              </div>
            </div>
          </div>
        </section>
      </div>
    </section>
  </main>
  <footer class="py-4 bg-secondary text-white-50 text-center">
    <small>我的书架 · 个人技术整合练习 · 2026 秋季学期</small>
  </footer>
  <script src="libs/jquery-3.7.1.min.js"></script>
  <script src="libs/bootstrap.bundle.min.js"></script>
  <script src="libs/echarts.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
